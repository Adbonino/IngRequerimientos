
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mis cuentos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f8f6f2;
      color: #333;
    }

    header {
      background: #e9e1d6;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      font-size: 38px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    header p {
      font-family: Arial, sans-serif;
      color: #666;
      margin: 0;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h2 {
      text-align: center;
      font-weight: normal;
      font-size: 27px;
      margin-bottom: 12px;
    }

    .descripcion {
      text-align: center;
      font-family: Arial, sans-serif;
      color: #666;
      margin-bottom: 30px;
    }

    .visor {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 850px;
      border: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 30px;
      }

      main {
        margin: 25px auto;
        padding: 0 10px;
      }

      iframe {
        height: 650px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Mis cuentos</h1>
    <p>Un espacio para compartir historias y lecturas</p>
  </header>

  <main>

    <h2>Mi primer cuento</h2>

    <p class="descripcion">
      Te invito a leer este cuento.
    </p>

    <div class="visor">

      <iframe
        src="IngenieríadeRequerimientosTP1.pdf#toolbar=0&navpanes=0&view=FitH"
        title="Leer el cuento"
        loading="lazy">
      </iframe>

    </div>

  </main>

  <footer>
    © Mis cuentos
  </footer>

</body>
</html>
