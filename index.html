
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis cuentos</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: #f8f6f2;
      color: #333;
    }

    header {
      background: #e9e1d6;
      text-align: center;
      padding: 45px 20px;
    }

    header h1 {
      font-size: 38px;
      font-weight: normal;
      margin: 0 0 12px;
    }

    header p {
      font-family: Arial, sans-serif;
      color: #666;
      margin: 0;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h2 {
      text-align: center;
      font-weight: normal;
      font-size: 27px;
      margin-bottom: 12px;
    }

    .descripcion {
      text-align: center;
      font-family: Arial, sans-serif;
      color: #666;
      margin-bottom: 30px;
    }

    .visor {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 800px;
      border: none;
    }

    .botones {
      text-align: center;
      padding: 20px;
    }

    .botones a {
      display: inline-block;
      background: #755548;
      color: white;
      padding: 12px 22px;
      text-decoration: none;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #888;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <header>
    <h1>Mis cuentos</h1>
    <p>Un espacio para compartir historias y lecturas</p>
  </header>

  <main>

    <h2>Mi primer cuento</h2>

    <p class="descripcion">
      Te invito a leer este cuento.
    </p>

    <div class="visor">

      <iframe
        src="cuento.pdf#view=FitH"
        title="Leer el cuento">
      </iframe>

      <div class="botones">
        <a href="cuento.pdf" download>
          Descargar PDF
        </a>
      </div>

    </div>

  </main>

  <footer>
    © Mis cuentos
  </footer>

</body>
</html>
